<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ellen">
    <meta name="description" content="Site da empresa DevConnect">

    <title>Perfil - DevConnect</title>

    <link rel="shortcut icon" href="../assets/images/logo-devconnect-sm.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/perfil.css">
</head>


<body>
    <h1> Tela Perfil - DevConnect</h1>
    <header id="cabecalho">
        <nav>
            <a href=".perfil.html">
                <img id="logo-desktop" src="../assets/images/logo-devconnect-md.svg" alt="Logo do DevConnect">
            </a>

            <a href=".perfil.html">
                <img id="logo-mobile" src="../assets/images/logo-devconnect-sm.svg" alt="Logo do DevConnect">
            </a>

            <div class="cabecalho-acoes">

                <div class="cabecalho-acoes">
                    <a href="perfil.html">
                        <img src="../assets/images/icone-casa-marrom.svg" alt="">
                    </a>
                    <a href="#">
                        <img src="../assets/images/icone-coracao-marrom.svg" alt="">
                    </a>
                    <a href="#">
                        <img class="foto-perfil" src="../assets/images/livro.jpg" alt="">
                    </a>

                </div>

            </div>

        </nav>
    </header>

    <main>
        <section id="perfil">

            <header class="dados-perfil">
                <a href="#">
                    <img class="foto-perfil-bio" src="../assets/images/livro.jpg" alt="">
                </a>
                <nav class="informacoes">
                    <span>study_vlogs</span>
                    <div>
                        <span>10 publicacoes</span>
                        <span>300 seguindo</span>
                        <span>800 seguidores</span>
                    </div>

                    <div id="info">
                        <p>ellen nery</p>
                        <a href="">Editar Perfil</a>
                        <a href="">Sair</a>
                    </div>

                </nav>
            </header>

        </section>

       
        <section id="publicacoes">
            <div class="subtitulo-publicacoes">
                <img src="../assets/images/icone-publicacao-marrow.svg" alt="">
                <h2>Publicações</h2>
            </div>
            
           
            <article class="card-publi">
                <header>
                    <a href="#">
                        <img class="foto-perfil" src="../assets/images/livro.jpg" alt="">
                        study_vlogs
                    </a>
                </header>

                <p class="descricao-publicacao">Tenha sua rotina de estudo organizada e com dicas!</p>
                <div class="interacoes-publicacao">
                    <button type="button">
                        <img src="../assets/images/icone-coracao-preto.svg" alt="">
                    </button>

                    <button type="button">
                        <img src="../assets/images/icone-comentario-preto.svg" alt="">
                    </button>

                    <span>100 curtidas</span>
                </div>

                <button type="button">Ver todos os comentários...</button>
            </article>
            

        </section>


    </main>

</body>

</html>
